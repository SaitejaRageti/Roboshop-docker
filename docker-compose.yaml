networks:
  default:
    driver: bridge
    name: roboshop
services:
  mongodb:
    image: saitejarageti/mongodb:v1
    container_name: mongodb
  catalogue:
    image: saitejarageti/catalogue:v1
    container_name: catalogue
    depends_on: 
      - mongodb
  redis:
    image: saitejarageti/redis:v1
    container_name: 
      - redis
  user:
    image: saitejarageti/user:v1
    container_name: user
    depends_on: 
      - redis
      - mongodb
  cart:
    image: saitejarageti/cart:v1
    container_name: cart
    depends_on:
      - catalogue
      - redis
  mysql:
    image: saitejarageti/mysql:v1
    container_name: mysql

  shipping:
    image: saitejarageti/shipping:v1
    container_name: shipping
    depends_on:
    - mysql
    - cart
  rabbitmq:
    image: rabbitmq:3
    container_name: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: roboshop
      RABBITMQ_DEFAULT_PASS: roboshop123
  payment:
    image: saitejarageti/payment:v1
    container_name: payment
    environment:
      CART_HOST: cart
      CART_PORT: 8080
      USER_HOST: user
      USER_PORT: 8080
      AMQP_HOST: rabbitmq
      AMQP_USER: roboshop
      AMQP_PASS: roboshop123
    depends_on:
    - rabbitmq
    - cart
    - user
  frontend:
    image: saitejarageti/frontend:v1
    container_name: frontend
    ports:
    - "80:80"
    depends_on:
    - catalogue
    - user
    - cart
    - shipping
    - payment
      
    
  
  


